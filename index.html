<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>做世界的牡蛎 | 于淼淼</title>
    <style>
        /* ==================== 
           0. 全局设置 
           ==================== */
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f8f8f8;
            color: #333;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ==================== 
           1. 英雄区域 (Hero) 
           ==================== */
        .hero {
            height: 100vh;
            width: 100%;
            background-image: url('images/hero.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            position: relative;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 1;
        }

        .hero-content {
            z-index: 2;
            text-align: center;
            padding: 20px;
            animation: fadeIn 1.5s ease-out;
        }

        .nav-bar {
            position: absolute;
            top: 30px;
            right: 50px;
            z-index: 10;
        }

        .nav-bar a {
            color: rgba(255, 255, 255, 0.8);
            margin-left: 30px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
            position: relative;
        }

        .nav-bar a:hover {
            color: white;
        }

        .nav-bar a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -5px;
            left: 0;
            background-color: white;
            transition: width 0.3s;
        }

        .nav-bar a:hover::after {
            width: 100%;
        }

        /* ==================== 
           2. 容器与通用样式 
           ==================== */
        .container {
            max-width: 1000px;
            margin: 0 auto; 
            padding: 80px 20px;
            background-color: white;
            position: relative;
            z-index: 2;
        }

        .section {
            padding-top: 60px;
            margin-bottom: 120px;
        }

        h2 {
            border-left: 4px solid #333;
            padding-left: 20px;
            text-transform: uppercase;
            margin-bottom: 40px;
            font-size: 1.6rem;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* 小标题样式 */
        .sub-title {
            font-size: 0.9rem;
            color: #999;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: block;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        /* ==================== 
           3. 技能圆球 
           ==================== */
        .skill-group-label {
            font-size: 0.8rem;
            color: #999;
            letter-spacing: 2px;
            margin: 40px 0 20px 0;
            text-transform: uppercase;
            font-weight: bold;
            display: block;
        }

        .skill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: flex-start;
        }

        .skill-circle {
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: 1px solid #f0f0f0;
        }

        .skill-circle:hover {
            transform: scale(1.15) translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            z-index: 2;
        }

        .skill-emoji {
            font-size: 2.2rem;
            margin-bottom: 2px;
            line-height: 1;
        }

        .skill-name {
            font-size: 0.7rem;
            color: #555;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .skill-circle.locked {
            box-shadow: none;
            border: 2px dashed #ddd;
            background: transparent;
            opacity: 0.7;
        }
        
        .skill-circle.locked .skill-emoji {
            filter: grayscale(100%);
            opacity: 0.5;
        }

        .skill-circle.locked:hover {
            border-color: #aaa;
            opacity: 1;
            transform: scale(1.1);
        }

        .skill-circle.locked:hover .skill-emoji {
            filter: grayscale(0%);
            opacity: 1;
        }


        /* ==================== 
           4. 智能网格系统 
           ==================== */
        .smart-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 50px;
        }

        @media (max-width: 768px) {
            .smart-grid {
                grid-template-columns: 1fr;
            }
        }

        .work-item {
            transition: transform 0.3s ease;
        }
        .work-item:hover {
            transform: translateY(-5px);
        }

        /* 图片容器 */
        .img-box {
            width: 100%;
            overflow: hidden;
            border-radius: 4px;
            background: #eee;
            margin-bottom: 15px;
        }

        .ratio-portrait {
            aspect-ratio: 2 / 3;
        }

        .ratio-landscape {
            aspect-ratio: 16 / 9;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .work-title {
            font-size: 1rem;
            font-weight: bold;
            margin: 0;
        }

        .work-desc {
            font-size: 0.8rem;
            color: #888;
            margin: 5px 0 0 0;
        }


        /* ==================== 
           5. 动画定义
